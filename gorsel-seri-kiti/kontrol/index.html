<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Kontrol örnekleri</title><style>
/* stil.md A bölümü = buradaki değişkenler. Renk/yazı kararı yalnız burada değişir. */
:root{--zemin:#14161A;--metin:#fff;--ikincil:#B8BCC4;--vurgu:#FFC400;
--font:'Inter',system-ui,sans-serif;--kenar:64px;--baslik:96px;}
*{box-sizing:border-box;margin:0}
.kapak{width:1280px;height:720px;background:var(--zemin);color:var(--metin);font-family:var(--font);
position:relative;overflow:hidden;display:flex;padding:var(--kenar);gap:48px;align-items:flex-end}
.blok{flex:1 1 55%;min-width:0;display:flex;flex-direction:column;gap:24px}
.baslik{font-size:var(--baslik);font-weight:800;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.baslik b{color:var(--vurgu);font-weight:800}
.alt{font-size:36px;font-weight:500;color:var(--ikincil);line-height:1.2}
.cip{align-self:flex-start;font-size:28px;font-weight:800;color:#14161A;background:var(--vurgu);padding:6px 18px;border-radius:6px}
.gorsel{flex:0 0 45%;align-self:stretch;margin:calc(var(--kenar)*-1) calc(var(--kenar)*-1) calc(var(--kenar)*-1) 0;
background:#2a2e36 center/cover no-repeat}
/* varyantlar (stil.md C) */
.kapak.m-uzun{--baslik:80px}
.kapak.m-gorselsiz .blok{flex-basis:100%;justify-content:center;align-self:stretch;border-left:8px solid var(--vurgu);padding-left:40px}
</style><style>body{margin:0;background:#000;padding:24px;font:14px system-ui;color:#ccc}.w{zoom:.45;margin-bottom:8px}.k{display:inline-block;margin:0 12px 12px 0;vertical-align:top}</style></head><body><div class="k"><div>1 · Kısa başlık, görselli</div><div class="w"><div class="kapak "><div class="blok"><span class="cip">YENİ</span><h1 class="baslik">Hızlı <b>başla</b></h1><p class="alt">3 dakikada kurulum</p></div><div class="gorsel"></div></div></div></div><div class="k"><div>2 · Uzun başlık, görselli</div><div class="w"><div class="kapak m-uzun"><div class="blok"><span class="cip">REHBER</span><h1 class="baslik">Kapak tasarımında aynı seriyi koruyan <b>stil dosyası</b> nasıl hazırlanır</h1><p class="alt">Referanstan şablona adım adım</p></div><div class="gorsel"></div></div></div></div><div class="k"><div>3 · Ana görselsiz bilgi kartı</div><div class="w"><div class="kapak m-gorselsiz"><div class="blok"><span class="cip">NOT</span><h1 class="baslik">Toplantı özeti: <b>üç</b> karar</h1><p class="alt">Tarih ve sorumlular ekte</p></div></div></div></div></body></html>
